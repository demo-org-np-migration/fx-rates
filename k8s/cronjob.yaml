apiVersion: batch/v1
kind: CronJob
metadata:
  name: fx-rates
  labels:
    app.kubernetes.io/name: fx-rates
    app.kubernetes.io/part-of: cauri
    cauri.io/team: risk
spec:
  schedule: "*/15 * * * *"
  # Una corrida por vez: si la anterior sigue (o está trabada), la siguiente no arranca y no se apilan Jobs.
  concurrencyPolicy: Forbid
  # Si el cron no pudo arrancar a horario (controlador caído, cluster lleno), se saltea en vez de recuperar todas juntas.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Una corrida que no termina en 10 minutos (imagen que no se puede bajar, pod sin lugar) se da por fallida y
      # el historial la limpia, en vez de quedar ocupando un pod para siempre.
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fx-rates
            app.kubernetes.io/part-of: cauri
            cauri.io/team: risk
        spec:
          restartPolicy: OnFailure
          containers:
            - name: fx-rates
              image: ghcr.io/demo-org-np-migration/fx-rates:IMAGE_TAG
              env:
                - name: ENV
                  value: "ENV_PLACEHOLDER"
                - name: DB_HOST
                  value: "postgres"
                - name: DB_NAME
                  value: "rates"
                - name: NP_TEST_ANY
                  value: "any-1"
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
